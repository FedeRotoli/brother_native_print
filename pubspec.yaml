name: brother_native_print
description: >-
  Flutter plugin to print images and PDFs to Brother label and mobile printers
  (RJ and QL series) over Wi-Fi, Bluetooth (BLE) and USB on Android.
version: 0.6.0
repository: https://github.com/FedeRotoli/brother_native_print
issue_tracker: https://github.com/FedeRotoli/brother_native_print/issues
documentation: https://pub.dev/documentation/brother_native_print/latest/
topics:
  - printing
  - printer
  - brother
  - bluetooth
  - label-printer

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.teknysrl.brother_native_print
        pluginClass: BrotherNativePrintPlugin
      ios:
        pluginClass: BrotherNativePrintPlugin

  # Custom paper .bin files (generated with Brother Paper Size Setup Tool),
  # bundled with the package so applications can use them without copying them.
  # Flutter does NOT include subfolders of an asset directory recursively,
  # so each subfolder must be listed explicitly. They are accessible at
  # `packages/brother_native_print/custom_paper/...` (see BrotherCustomPaper).
  assets:
    - custom_paper/CustomRJ2050Paper/
    - custom_paper/CustomRJ2150Paper/
    - custom_paper/CustomRJ3050AiPaper/
    - custom_paper/CustomRJ3050Paper/
    - custom_paper/CustomRJ3150AiPaper/
    - custom_paper/CustomRJ3150Paper/
    - custom_paper/CustomRJ3230BPaper/
    - custom_paper/CustomRJ3250WBPaper/
    - custom_paper/CustomRJ4030AiPaper/
    - custom_paper/CustomRJ4030Paper/
    - custom_paper/CustomRJ4040Paper/
    - custom_paper/CustomRJ4230Paper/
    - custom_paper/CustomRJ4250Paper/
    - custom_paper/CustomTD2120NPaper/
    - custom_paper/CustomTD2125NPaper/
    - custom_paper/CustomTD2125NWBPaper/
    - custom_paper/CustomTD2130NPaper/
    - custom_paper/CustomTD2135NWBPaper/
    - custom_paper/CustomTD4550Paper/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
